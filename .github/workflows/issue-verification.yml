name: Issue verification

# Labels issues verified or not verified.
# Active members of fossasia/eventyay-core and fossasia/eventyay-devs are verified.
on:
  issues:
    types: [opened, transferred]
  workflow_dispatch:
    inputs:
      all_open:
        description: Label every open issue
        required: false
        type: boolean
        default: false
      issue_number:
        description: One issue number. Ignored when every open issue is selected.
        required: false
        type: string

jobs:
  label:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fossasia'
    # github.run_id stays short. Combining github.event.issue with || can
    # stringify the whole issue payload and exceed the 400 character limit.
    concurrency:
      group: issue-verification-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      # Issue and label changes use the repository token. Team membership is an
      # organization permission, which GITHUB_TOKEN cannot be granted.
      # EVENTYAY_TOKEN is the existing GitHub token used by the Docker workflows.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEAM_READ_TOKEN: ${{ secrets.EVENTYAY_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Label issues verified or not verified
        run: |
          set -euo pipefail

          if [ -z "${TEAM_READ_TOKEN}" ]; then
            echo "EVENTYAY_TOKEN is not set. Team membership checks need that token to have Members: read on the fossasia organization."
            exit 1
          fi

          members="$(
            for team in eventyay-core eventyay-devs; do
              if ! GH_TOKEN="$TEAM_READ_TOKEN" gh api --paginate "orgs/fossasia/teams/${team}/members" --jq '.[].login'; then
                echo "Cannot read fossasia/${team}. EVENTYAY_TOKEN needs access to that team." >&2
                exit 1
              fi
            done
          )"

          ensure_label() {
            local name="$1" color="$2" description="$3" label_err code
            label_err="$(mktemp)"
            set +e
            gh api "repos/${REPO}/labels/$(jq -rn --arg n "$name" '$n|@uri')" >/dev/null 2>"$label_err"
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              if grep -q 'HTTP 404' "$label_err"; then
                gh label create "$name" --repo "$REPO" --color "$color" --description "$description"
              else
                cat "$label_err" >&2
                rm -f "$label_err"
                return 1
              fi
            fi
            rm -f "$label_err"
          }

          ensure_label "verified" "0E8A16" "Opened by a member of eventyay-core or eventyay-devs"
          ensure_label "not verified" "FBCA04" "Opened by someone outside the eventyay maintainer teams"

          label_issue() {
            local number="$1" issue author label other current
            issue="$(gh api "repos/${REPO}/issues/${number}")"
            if [ "$(jq -r '.pull_request != null' <<<"$issue")" = "true" ]; then
              echo "#${number} is a pull request; skipping."
              return 0
            fi
            author="$(jq -r '.user.login // empty' <<<"$issue")"
            if [ -z "$author" ]; then
              echo "Could not determine the author of issue #${number}." >&2
              return 1
            fi
            if grep -Fxq "$author" <<<"$members"; then
              label="verified"
              other="not verified"
            else
              label="not verified"
              other="verified"
            fi
            gh issue edit "$number" --repo "$REPO" --add-label "$label"
            current="$(gh issue view "$number" --repo "$REPO" --json labels --jq '.labels[].name')"
            if grep -Fxq "$other" <<<"$current"; then
              gh issue edit "$number" --repo "$REPO" --remove-label "$other"
            fi
            echo "Issue #${number} by ${author}: ${label}"
          }

          numbers=()
          if [ "$(jq -r '.inputs.all_open // false' "$GITHUB_EVENT_PATH")" = "true" ]; then
            mapfile -t numbers < <(gh issue list --repo "$REPO" --state open --limit 500 --json number --jq '.[].number')
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            numbers=("$(jq -r '.inputs.issue_number // empty' "$GITHUB_EVENT_PATH")")
          else
            numbers=("$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")")
          fi

          if [ "${#numbers[@]}" -eq 0 ] || [ -z "${numbers[0]}" ]; then
            echo "No issues to label."
            exit 1
          fi

          failed=0
          for number in "${numbers[@]}"; do
            if ! label_issue "$number"; then
              failed=$((failed + 1))
            fi
          done
          echo "Labeled ${#numbers[@]} issue(s); failures: ${failed}"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
