name: Issue verification

# verified: active member of fossasia/eventyay-core or eventyay-devs.
# not verified: everyone else. Pull requests are rejected.
on:
  issues:
    types: [opened, transferred]
  workflow_dispatch:
    inputs:
      all_open:
        description: Label every open issue
        type: boolean
        default: false
      issue_number:
        description: One issue number. Ignored when labeling every open issue.
        type: string

jobs:
  verify-issues:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'fossasia'
    concurrency:
      group: issue-verification-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TEAM_READ_TOKEN: ${{ secrets.EVENTYAY_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Label issues
        run: |
          set -euo pipefail
          [ -n "${TEAM_READ_TOKEN}" ] || { echo "EVENTYAY_TOKEN is not set." >&2; exit 1; }

          members="$(
            for team in eventyay-core eventyay-devs; do
              GH_TOKEN="$TEAM_READ_TOKEN" gh api --paginate "orgs/fossasia/teams/${team}/members" --jq '.[].login'
            done
          )"

          ensure() {
            local err code
            err="$(mktemp)"
            set +e
            gh api "repos/${REPO}/labels/$(jq -rn --arg n "$1" '$n|@uri')" >/dev/null 2>"$err"
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              grep -q 'HTTP 404' "$err" || { cat "$err" >&2; rm -f "$err"; return 1; }
              gh label create "$1" --repo "$REPO" --color "$2" --description "$3"
            fi
            rm -f "$err"
          }
          ensure verified 0E8A16 "Opened by a member of eventyay-core or eventyay-devs"
          ensure "not verified" FBCA04 "Opened by someone outside the eventyay maintainer teams"

          label_issue() {
            local issue author label other current
            issue="$(gh api "repos/${REPO}/issues/$1")" || return 1
            [ "$(jq -r '.pull_request != null' <<<"$issue")" = true ] && { echo "#$1 is a pull request." >&2; return 1; }
            author="$(jq -r '.user.login // empty' <<<"$issue")"
            [ -n "$author" ] || return 1
            if grep -Fxq "$author" <<<"$members"; then label=verified; other="not verified"; else label="not verified"; other=verified; fi
            gh issue edit "$1" --repo "$REPO" --add-label "$label" || return 1
            current="$(gh issue view "$1" --repo "$REPO" --json labels --jq '.labels[].name')" || return 1
            if grep -Fxq "$other" <<<"$current"; then gh issue edit "$1" --repo "$REPO" --remove-label "$other" || return 1; fi
            echo "#$1 ${author}: ${label}"
          }

          numbers=()
          if [ "$(jq -r '.inputs.all_open // false' "$GITHUB_EVENT_PATH")" = true ]; then
            meta="$(gh api -X GET search/issues -f q="repo:${REPO} is:issue is:open" -f per_page=1 --jq '{total:.total_count,incomplete:.incomplete_results}')"
            [ "$(jq -r .incomplete <<<"$meta")" = true ] && { echo "Issue search was incomplete." >&2; exit 1; }
            mapfile -t numbers < <(gh api --paginate -X GET search/issues -f q="repo:${REPO} is:issue is:open" -f per_page=100 --jq '.items[].number')
            [ "$(printf '%s\n' "${numbers[@]}" | sed '/^$/d' | wc -l | tr -d ' ')" = "$(jq -r .total <<<"$meta")" ] || { echo "Open issue list was partial." >&2; exit 1; }
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            numbers=("$(jq -r '.inputs.issue_number // empty' "$GITHUB_EVENT_PATH")")
          else
            numbers=("$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")")
          fi
          [ -n "${numbers[0]:-}" ] || { echo "No issues to label." >&2; exit 1; }

          failed=0
          for number in "${numbers[@]}"; do
            [ -n "$number" ] || continue
            label_issue "$number" || failed=$((failed + 1))
          done
          echo "failures:${failed}"
          [ "$failed" -eq 0 ]
